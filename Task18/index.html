<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greeting App</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <h1 id="greeting">Hello</h1>
    </header>


    
    <div class="boxes">

        <div class="box" onclick="changeColor(this, 'red')">
            Red
        </div>

        <div class="box" onclick="changeColor(this, 'blue')">
            Blue
        </div>

        <div class="box" onclick="changeColor(this, 'green')">
            Green
        </div>

        <div class="box" onclick="changeColor(this, 'yellow')">
            Yellow
        </div>

    </div>


    
    <div class="input-section">

        <input
            type="text"
            id="name"
            placeholder="Enter your name">

        <button onclick="greetUser()">
            Greet Me
        </button>

    </div>


    
    <script src="script.js"></script>

</body>

</html>
